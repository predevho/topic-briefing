  # =========================================================
  # 애그리게이터 — 남이 이미 골라준 신호를 그대로 받는다.
  # 개별 블로그를 다 등록하는 대신, 사람들이 투표로 올린 글을 받는 쪽이
  # 넓이와 품질을 동시에 가져간다. 출처가 제각각이어서 본문 확보는
  # enrich 단계에서 trafilatura가 맡는다.
  #
  # 이 구획이 맨 뒤에 있는 것은 의도다. 같은 글이 직접 구독한 소스와
  # 애그리게이터에 동시에 올라오면 collect는 sources.yaml에서 먼저 만난
  # 쪽을 남긴다(setdefault). 그때 남기고 싶은 것은 글의 원래 제목과 그 글
  # 자신의 요약이다 — 애그리게이터 편집자가 붙인 제목이 아니라.
  # 브리핑 헤드라인의 재료가 되기 때문이다. 순서를 바꾸면 뒤집힌다.
  # =========================================================

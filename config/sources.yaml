# 수집 소스.
#
# weight: LLM 점수에 곱하는 가중치. 1.0이 기준.
#   기업 기술블로그처럼 관심사 정중앙인 소스는 1.2~1.3,
#   일반 매체 속보성 기사가 섞이는 소스는 0.8~0.9로 둔다.
# lang: ko | en. 해외 소스는 요약 시 한국어로 번역한다(spec 5.4).
#   수집·점수·적재 경로는 국내 소스와 완전히 같다. 분기는 요약 프롬프트에만 있다.
# enabled: false로 두면 수집에서 제외된다(삭제하지 않고 끌 수 있게).
#
# 이 목록은 `python scripts/check_feeds.py`로 실제 확인한 것만 enabled: true다.
# 주소가 바뀌는 일이 흔하므로, 0건이 며칠 이어지는 소스는 다시 돌려본다.

